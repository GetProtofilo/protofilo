<!DOCTYPE html>
<html>
<head>
  <title>Gaming Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
<style>
  :root {
    --blue: #0f1e3d;
    --yellow: #e6ee0d;
  }
  body {
    background: linear-gradient(145deg, #0a182f, var(--blue));
  }
  .glass {
    background-color: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .glow {
    box-shadow: 0 0 12px var(--yellow);
  }
</style>

</head>
<body class="text-white font-sans min-h-screen flex flex-col items-center">
  <div class="w-full flex justify-between items-center px-5 py-4 bg-[#0c1529] border-b border-[#1c2b4a]">
    <a href="index.html" class="text-white text-xl font-bold">←</a>
    <h1 class="text-yellow-400 font-bold text-lg">Gamer Profile</h1>
    <a href="settings.html" class="text-sm text-yellow-300">⚙️ Edit</a>
  </div>
  <div class="flex flex-col items-center mt-8">
    <img src="https://i.pravatar.cc/100?u=adi12311" class="rounded-full w-28 h-28 border-4 glow border-yellow-400" />
    <h2 class="mt-4 text-2xl font-bold">adi12311</h2>
    <p class="text-sm text-gray-400">ID: <span class="font-mono">445839</span> <button onclick="navigator.clipboard.writeText('445839')" class="ml-1 text-yellow-400">📋</button></p>
  </div>
  <div class="mt-8 w-11/12 max-w-md p-6 rounded-xl glass text-white">
    <div class="flex justify-between mb-4 items-center">
      <span class="text-sm text-yellow-300 font-semibold">Your Stats</span>
      <select class="bg-[#1a2a47] text-white px-2 py-1 text-sm rounded">
        <option>OVERALL</option>
        <option>SOLO</option>
        <option>DUO</option>
        <option>SQUAD</option>
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4 text-center">
      <div><p class="text-gray-300 text-xs">MATCHES</p><p class="text-xl font-bold">5</p></div>
      <div><p class="text-gray-300 text-xs">WINS</p><p class="text-xl font-bold">0</p></div>
      <div><p class="text-gray-300 text-xs">KILLS</p><p class="text-xl font-bold">0</p></div>
      <div><p class="text-gray-300 text-xs">HEADSHOTS</p><p class="text-xl font-bold">0</p></div>
      <div><p class="text-gray-300 text-xs">WIN RATE</p><p class="text-xl font-bold">0%</p></div>
      <div><p class="text-gray-300 text-xs">K/D</p><p class="text-xl font-bold">0</p></div>
    </div>
  </div>
  <button class="mt-8 bg-yellow-400 text-black font-bold py-2 px-6 rounded-full hover:bg-yellow-300">Log Out</button>
</body>
</html>
