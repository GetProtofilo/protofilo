<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamer Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --blue: #0f1e3d;
      --yellow: #e6ee0d;
    }
    body {
      background: radial-gradient(circle at top, #0f1e3d, #0a162b);
      font-family: 'Orbitron', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow {
      box-shadow: 0 0 16px var(--yellow), 0 0 8px var(--yellow);
    }
  </style>
</head>
<body class="text-white flex flex-col min-h-screen items-center">

  <!-- Navbar -->
  <div class="w-full flex justify-between items-center px-6 py-4 bg-[#101c38] border-b border-yellow-400">
    <a href="index.html" class="text-yellow-400 text-xl font-bold">← Dashboard</a>
    <h1 class="text-xl font-bold tracking-wide">👾 Gamer Profile</h1>
    <a href="settings.html" class="text-yellow-400 font-semibold text-sm">⚙️ Settings</a>
  </div>

  <!-- Profile Section -->
  <div class="flex flex-col items-center mt-10 w-full px-4">
    <img src="https://cdn.pixabay.com/photo/2020/04/16/22/49/avatar-5055739_1280.png" class="rounded-full w-28 h-28 border-4 border-yellow-400 glow" />
    <h2 class="text-3xl font-extrabold mt-4 text-yellow-300">BeastSlayer_47</h2>
    <p class="text-sm text-gray-400 mt-1">ID: <span class="font-mono">918247</span> <button onclick="navigator.clipboard.writeText('918247')" class="ml-1 text-yellow-300">📋</button></p>
    <p class="text-xs text-gray-500">pro.gamer@fpshub.gg</p>
  </div>

  <!-- Stats Section -->
  <div class="mt-8 w-full max-w-xl px-4">
    <div class="glass p-6 rounded-xl">
      <div class="flex justify-between items-center mb-4">
        <span class="text-sm font-semibold text-yellow-300">🎯 Competitive Stats</span>
        <select class="bg-[#172c4f] text-white text-xs px-2 py-1 rounded">
          <option>OVERALL</option>
          <option>SOLO</option>
          <option>DUO</option>
          <option>SQUAD</option>
        </select>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-center text-sm">
        <div><p class="text-gray-400">Matches</p><p class="text-xl font-bold">82</p></div>
        <div><p class="text-gray-400">Wins</p><p class="text-xl font-bold">24</p></div>
        <div><p class="text-gray-400">Kills</p><p class="text-xl font-bold">563</p></div>
        <div><p class="text-gray-400">Headshots</p><p class="text-xl font-bold">211</p></div>
        <div><p class="text-gray-400">K/D Ratio</p><p class="text-xl font-bold">3.9</p></div>
        <div><p class="text-gray-400">Accuracy</p><p class="text-xl font-bold">42%</p></div>
      </div>
    </div>
  </div>

  <!-- Logout -->
  <div class="mt-10 mb-6">
    <button class="bg-yellow-400 text-black font-bold py-2 px-8 rounded-full hover:bg-yellow-300 transition-all duration-300">Log Out</button>
  </div>

</body>
</html>
