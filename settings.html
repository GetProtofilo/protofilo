<!DOCTYPE html>
<html>
<head>
  <title>Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="p-6 flex flex-col items-center min-h-screen">
  <header class="w-full flex justify-between items-center mb-6 px-4 py-3 border-b border-yellow-400">
    <a href="profile.html" class="text-yellow-400 text-lg">← Back</a>
    <h2 class="text-xl font-bold">Edit Profile</h2>
    <span></span>
  </header>
  <form onsubmit="event.preventDefault(); saveProfile();" class="w-full max-w-md glass p-6 rounded-xl space-y-4">
    <div>
      <label class="block text-sm text-gray-300 mb-1">Email</label>
      <input id="email" type="email" required class="w-full p-2 rounded bg-[#0f1e3d] text-white" />
    </div>
    <div>
      <label class="block text-sm text-gray-300 mb-1">Gamer Name</label>
      <input id="username" type="text" required pattern="^[a-zA-Z0-9_]{3,20}$" class="w-full p-2 rounded bg-[#0f1e3d] text-white" />
    </div>
    <button type="submit" class="btn-yellow w-full">Save</button>
  </form>

  <script>
    function saveProfile() {
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();

      if (!email.includes('@') || username.length < 3) {
        alert("Please enter valid email and username.");
        return;
      }

      localStorage.setItem("userEmail", email);
      localStorage.setItem("userName", username);
      alert("Profile updated!");
      window.location.href = "profile.html";
    }

    window.onload = function () {
      document.getElementById("email").value = localStorage.getItem("userEmail") || "gamer@ffarena.gg";
      document.getElementById("username").value = localStorage.getItem("userName") || "LegendX";
    };
  </script>
</body>
</html>
