<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0f1e3d, #0a162b);
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body class="text-white p-6 flex flex-col items-center min-h-screen">
  <header class="w-full flex justify-between items-center mb-6">
    <a href="profile.html" class="text-yellow-400 text-lg">← Back</a>
    <h2 class="text-xl font-bold">Edit Profile</h2>
    <span></span>
  </header>
  <form onsubmit="event.preventDefault(); saveProfile();" class="w-full max-w-md p-6 rounded-xl bg-[#1a2a47] space-y-4">
    <div>
      <label class="block text-sm text-gray-300 mb-1">Email</label>
      <input id="email" type="email" class="w-full p-2 rounded bg-[#0f1e3d] text-white" />
    </div>
    <div>
      <label class="block text-sm text-gray-300 mb-1">Gamer Name</label>
      <input id="username" type="text" class="w-full p-2 rounded bg-[#0f1e3d] text-white" />
    </div>
    <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded-full hover:bg-yellow-300">Save</button>
  </form>
  <script>
    function saveProfile() {
      const email = document.getElementById("email").value;
      const username = document.getElementById("username").value;
      localStorage.setItem("userEmail", email);
      localStorage.setItem("userName", username);
      alert("Saved! Go back to profile to see changes.");
      window.location.href = "profile.html";
    }
    window.onload = function () {
      document.getElementById("email").value = localStorage.getItem("userEmail") || "pro.gamer@fpshub.gg";
      document.getElementById("username").value = localStorage.getItem("userName") || "BeastSlayer_47";
    };
  </script>
</body>
</html>
