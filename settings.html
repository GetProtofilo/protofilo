<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - Gaming Theme</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --blue: #0f1e3d;
      --yellow: #e6ee0d;
    }
    body {
      background: radial-gradient(circle at top, #0f1e3d, #0a162b);
      font-family: 'Orbitron', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow {
      box-shadow: 0 0 16px var(--yellow), 0 0 8px var(--yellow);
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center">

  <div class="w-full flex justify-between items-center px-6 py-4 bg-[#101c38] border-b border-yellow-400">
    <a href="profile.html" class="text-yellow-400 text-xl font-bold">← Back</a>
    <h1 class="text-xl font-bold tracking-wide">⚙️ Edit Profile</h1>
    <span class="text-yellow-400 text-sm">Save</span>
  </div>

  <form class="mt-10 w-full max-w-md px-4 space-y-6 glass p-6 rounded-xl">
    <div>
      <label class="block text-sm text-gray-300 mb-1">Email Address</label>
      <input type="email" placeholder="pro.gamer@fpshub.gg" class="w-full bg-[#1a2a47] text-white p-2 rounded focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm text-gray-300 mb-1">Password</label>
      <input type="password" placeholder="********" class="w-full bg-[#1a2a47] text-white p-2 rounded focus:outline-none" />
    </div>
    <div>
      <label class="block text-sm text-gray-300 mb-1">Gamer Name</label>
      <input type="text" placeholder="BeastSlayer_47" class="w-full bg-[#1a2a47] text-white p-2 rounded focus:outline-none" />
    </div>
    <button class="w-full bg-yellow-400 text-black font-bold py-2 rounded-full hover:bg-yellow-300 transition-all duration-300">Save Changes</button>
  </form>

</body>
</html>
